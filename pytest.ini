[pytest]
# Pytest configuration for iEEG BrainSense Analysis App

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Coverage options (if pytest-cov installed)
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    # Fail on warnings (helps catch deprecations)
    # -W error
    # Show print statements
    -s

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (slower, multiple components)
    ui: UI tests (require display, manual verification)
    slow: Slow tests (>1 second)
    database: Tests that interact with databases
    security: Security-related tests (path traversal, validation)
    responsive: Responsive-layout invariants (window/screen size, density, arrangement)
    export_determinism: Export bytes must not depend on window, screen, DPR or UI scale
    qt_subprocess: Runs Qt in a fresh subprocess (env-dependent startup, purity probes)
    golden: Compares against a recorded golden (metrics snapshot, TSV, md5)

# Minimum Python version
minversion = 3.10

# Per-test hang guard (pytest-timeout, seconds); the slowest test takes ~90 s
timeout = 900

# Show warnings
filterwarnings =
    # Show all warnings
    default
    # Ignore specific warnings if needed
    # ignore::DeprecationWarning:pyside6.*
